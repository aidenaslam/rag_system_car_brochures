[project]
name = "rag-system-car-brochures"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aidenaslam", email = "aidenaslam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "polars>=1.44.2",
]

[project.scripts]
rag-system-car-brochures = "rag_system_car_brochures:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.0",
    "docformatter>=1.7.8",
    "isort>=9.0.2",
    "jupyter>=1.1.1",
    "pre-commit>=4.6.2",
    "pycln>=2.6.0",
    "pylint>=4.1.2",
]
